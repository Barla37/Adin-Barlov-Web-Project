<div class="card auth-card">
  <div class="card-body p-4">
    <h2 class="h4 mb-3">Create an account</h2>
    <form id="register-form" novalidate>
      <div class="row g-3">
        <div class="col-6">
          <label class="form-label" for="reg-first">First name</label>
          <input type="text" class="form-control" id="reg-first" required>
        </div>
        <div class="col-6">
          <label class="form-label" for="reg-last">Last name</label>
          <input type="text" class="form-control" id="reg-last" required>
        </div>
        <div class="col-12">
          <label class="form-label" for="reg-email">Email</label>
          <input type="email" class="form-control" id="reg-email" required>
        </div>
        <div class="col-12">
          <label class="form-label" for="reg-phone">Phone (optional)</label>
          <input type="tel" class="form-control" id="reg-phone">
        </div>
        <div class="col-12">
          <label class="form-label" for="reg-password">Password</label>
          <input type="password" class="form-control" id="reg-password" minlength="8" required>
          <div class="form-text">At least 8 characters.</div>
        </div>
      </div>
      <button type="button" class="btn btn-warning w-100 mt-4" onclick="location.hash='#/login'">Register</button>
    </form>
    <p class="small text-muted mt-3 mb-0">Already a member? <a href="#/login">Log in</a></p>
  </div>
</div>
