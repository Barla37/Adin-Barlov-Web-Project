<div class="card auth-card">
  <div class="card-body p-4">
    <h2 class="h4 mb-3">Log in</h2>
    <form id="login-form" novalidate>
      <div class="mb-3">
        <label class="form-label" for="login-email">Email</label>
        <input type="email" class="form-control" id="login-email" placeholder="you@example.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="login-password">Password</label>
        <input type="password" class="form-control" id="login-password" required>
      </div>
      <button type="button" class="btn btn-warning w-100" onclick="location.hash='#/dashboard'">Log in</button>
    </form>
    <p class="small text-muted mt-3 mb-0">No account? <a href="#/register">Register</a></p>
  </div>
</div>
