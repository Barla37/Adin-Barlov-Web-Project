<div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
  <h1 class="page-title h3 mb-0">Trainers</h1>
  <button class="btn btn-warning btn-sm" data-bs-toggle="modal" data-bs-target="#trainerModal">
    <i class="bi bi-plus-lg"></i> Add trainer <span class="badge badge-admin">admin</span>
  </button>
</div>

<div class="row g-3">
  <div class="col-md-6 col-lg-4"><div class="card h-100"><div class="card-body">
    <h2 class="h5">Amar Hodžić</h2>
    <p class="text-muted small mb-1">Specialty: HIIT, Strength</p>
    <p class="small">8 years of experience. Certified strength and conditioning coach.</p>
    <div class="d-flex gap-2"><button class="btn btn-outline-secondary btn-sm">Edit</button><button class="btn btn-outline-danger btn-sm">Delete</button></div>
  </div></div></div>
  <div class="col-md-6 col-lg-4"><div class="card h-100"><div class="card-body">
    <h2 class="h5">Lejla Begić</h2>
    <p class="text-muted small mb-1">Specialty: Yoga, Pilates</p>
    <p class="small">RYT-500 certified yoga instructor.</p>
    <div class="d-flex gap-2"><button class="btn btn-outline-secondary btn-sm">Edit</button><button class="btn btn-outline-danger btn-sm">Delete</button></div>
  </div></div></div>
  <div class="col-md-6 col-lg-4"><div class="card h-100"><div class="card-body">
    <h2 class="h5">Emir Kovač</h2>
    <p class="text-muted small mb-1">Specialty: Spinning, Cardio</p>
    <p class="small">Former competitive cyclist.</p>
    <div class="d-flex gap-2"><button class="btn btn-outline-secondary btn-sm">Edit</button><button class="btn btn-outline-danger btn-sm">Delete</button></div>
  </div></div></div>
</div>

<div class="modal fade" id="trainerModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h2 class="modal-title h5">Add trainer</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body">
      <div class="mb-3"><label class="form-label">Full name</label><input class="form-control"></div>
      <div class="mb-3"><label class="form-label">Specialty</label><input class="form-control"></div>
      <div class="mb-3"><label class="form-label">Bio</label><textarea class="form-control" rows="3"></textarea></div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-warning">Save</button></div>
  </div></div>
</div>
